openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Takeovers CoS API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: capture
    description: Voice/text capture and ingestion
  - name: today
    description: Today tab — brief, tasks, and recent captures
  - name: briefing
    description: Daily briefing (legacy path)
  - name: tasks
    description: Task management
  - name: team
    description: Team members
  - name: principal
    description: Principal profile and preferences
  - name: settings
    description: App settings and feature flags
  - name: webhooks
    description: Twilio webhook endpoints
  - name: twilio
    description: Twilio webhook endpoints (legacy path)
  - name: threads
    description: Conversation threads
  - name: storage
    description: Object storage upload and serving endpoints
paths:
  /health:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: |
        Returns server health status. Reports postgres and redis service states.
        Returns 200 when all services are ok or not_configured (Redis is optional).
        Returns 503 when any service is in error state.
      responses:
        "200":
          description: Healthy or partially configured (redis not_configured is acceptable)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "503":
          description: Degraded — one or more services in error state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /healthz:
    get:
      operationId: healthCheckAlt
      tags: [health]
      summary: Health check (alternate path)
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "503":
          description: Degraded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /capture:
    post:
      operationId: submitCapture
      tags: [capture]
      summary: Submit a text capture
      description: |
        Accepts raw text input. Creates a message row immediately and enqueues
        a Claude parse job. Returns messageId and jobId.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitCaptureBody"
      responses:
        "202":
          description: Capture enqueued — message created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaptureJobResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /capture/voice:
    post:
      operationId: submitVoiceCapture
      tags: [capture]
      summary: Submit a voice capture (file upload)
      description: |
        Accepts a multipart/form-data audio file upload. The server persists the
        audio to Replit Object Storage, creates a message row with status
        'transcribing', and enqueues a Whisper+Claude processing job.
        Returns messageId and status 'transcribing'.
        Max file size: 25 MB. Accepted MIME types: audio/webm, audio/ogg,
        audio/mpeg, audio/mp4, audio/wav, audio/x-m4a.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [audio]
              properties:
                audio:
                  type: string
                  format: binary
                  description: Audio file to transcribe (25 MB max)
                durationSeconds:
                  type: number
                  description: Optional recorded duration hint for logging
      responses:
        "202":
          description: Voice capture started — message created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoiceCaptureStarted"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /capture/voice/{id}:
    get:
      operationId: getVoiceCaptureStatus
      tags: [capture]
      summary: Get voice capture status by message ID
      description: |
        Returns the current transcription/parse status for a voice message.
        Status: transcribing (no content_text yet) → parsed (transcribed, not yet claude-parsed)
        → done (claude_parse available).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Message ID returned from POST /capture/voice
      responses:
        "200":
          description: Voice capture status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoiceCaptureStatus"
        "404":
          description: Message not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /capture/{jobId}/status:
    get:
      operationId: getCaptureJobStatus
      tags: [capture]
      summary: Get the status of a capture job (legacy path)
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Job status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaptureJobStatus"
        "404":
          description: Job not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /today/brief:
    get:
      operationId: getTodayBrief
      tags: [today]
      summary: Get today's brief
      description: Returns the current day's brief (morning or evening), generating if needed
      responses:
        "200":
          description: Today's brief
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Briefing"
        "500":
          description: Error generating brief
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /today/tasks:
    get:
      operationId: getTodayTasks
      tags: [today]
      summary: Get prioritized task list for today
      description: Returns tasks owned by the principal, sorted by priority and due date
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [captured, dispatched, acknowledged, in_progress, blocked, complete, cancelled, open, done]
      responses:
        "200":
          description: Today's task list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"

  /today/recent-captures:
    get:
      operationId: getTodayRecentCaptures
      tags: [today]
      summary: Get recent captures stream
      description: Returns the last 20 captured messages (voice + text) for quick review
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Recent captures
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Message"

  /briefing/today:
    get:
      operationId: getTodayBriefing
      tags: [briefing]
      summary: Get today's briefing (legacy path)
      description: Returns the current day's briefing, generating it if needed
      responses:
        "200":
          description: Today's briefing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Briefing"
        "500":
          description: Error generating briefing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /briefing/today/regenerate:
    post:
      operationId: regenerateTodayBriefing
      tags: [briefing]
      summary: Force-regenerate today's briefing
      responses:
        "200":
          description: Freshly generated briefing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Briefing"
        "500":
          description: Error generating briefing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /principal:
    get:
      operationId: getPrincipal
      tags: [principal]
      summary: Get the principal profile
      description: Returns Selmen's profile and preferences
      responses:
        "200":
          description: Principal profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Principal"
        "404":
          description: Principal not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    patch:
      operationId: updatePrincipal
      tags: [principal]
      summary: Update the principal profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePrincipalBody"
      responses:
        "200":
          description: Updated principal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Principal"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /tasks:
    get:
      operationId: listTasks
      tags: [tasks]
      summary: List tasks
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [open, in_progress, done, blocked, captured, dispatched, acknowledged, complete, cancelled]
        - name: assigneeId
          in: query
          required: false
          schema:
            type: ["integer", "null"]
      responses:
        "200":
          description: Task list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
    post:
      operationId: createTask
      tags: [tasks]
      summary: Create a new task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTaskBody"
      responses:
        "201":
          description: Created task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /tasks/{id}:
    get:
      operationId: getTask
      tags: [tasks]
      summary: Get a single task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    patch:
      operationId: updateTask
      tags: [tasks]
      summary: Update a task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTaskBody"
      responses:
        "200":
          description: Updated task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    delete:
      operationId: deleteTask
      tags: [tasks]
      summary: Delete a task (soft delete)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /team:
    get:
      operationId: listTeamMembers
      tags: [team]
      summary: List team members
      responses:
        "200":
          description: Team member list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TeamMember"

  /team/{id}:
    get:
      operationId: getTeamMember
      tags: [team]
      summary: Get a single team member
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Team member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamMember"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /settings:
    get:
      operationId: getSettings
      tags: [settings]
      summary: Get app settings and feature flags
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppSettings"
    patch:
      operationId: updateSettings
      tags: [settings]
      summary: Update feature flags or settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSettingsBody"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppSettings"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /webhooks/twilio/sms-inbound:
    post:
      operationId: twilioSmsInbound
      tags: [webhooks]
      summary: Twilio inbound SMS webhook
      description: |
        Validates Twilio signature, parses the inbound SMS from the principal,
        routes it through the capture pipeline, and replies via SMS.
      responses:
        "200":
          description: Webhook processed
          content:
            text/xml:
              schema:
                type: string
        "403":
          description: Invalid signature or unauthorized sender
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /webhooks/twilio/sms-status:
    post:
      operationId: twilioSmsStatus
      tags: [webhooks]
      summary: Twilio SMS delivery status callback
      responses:
        "204":
          description: Status received

  /twilio/incoming:
    post:
      operationId: twilioIncomingSms
      tags: [twilio]
      summary: Twilio incoming SMS webhook (legacy path)
      responses:
        "200":
          description: Webhook received
          content:
            text/xml:
              schema:
                type: string

  /twilio/voice:
    post:
      operationId: twilioVoice
      tags: [twilio]
      summary: Twilio voice webhook (legacy path)
      responses:
        "200":
          description: Webhook received
          content:
            text/xml:
              schema:
                type: string

  /threads/principal:
    get:
      operationId: getPrincipalThread
      tags: [threads]
      summary: Get or create the principal talk thread
      description: Returns the single continuous principal_talk thread (creates it if it doesn't exist yet)
      responses:
        "200":
          description: Principal talk thread with recent messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThreadWithMessages"

  /threads:
    get:
      operationId: listThreads
      tags: [threads]
      summary: List conversation threads
      responses:
        "200":
          description: Thread list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Thread"

  /threads/{id}/messages:
    get:
      operationId: getThreadMessages
      tags: [threads]
      summary: Get messages in a thread
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
        - name: before
          in: query
          required: false
          schema:
            type: ["integer", "null"]
      responses:
        "200":
          description: Messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Message"
        "404":
          description: Thread not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /storage/uploads/request-url:
    post:
      tags: [storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadUrlRequest'
      responses:
        '200':
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadUrlResponse'
        '400':
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Failed to generate upload URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /storage/public-objects/{filePath}:
    get:
      tags: [storage]
      operationId: getPublicObject
      summary: Serve a public asset from PUBLIC_OBJECT_SEARCH_PATHS
      parameters:
        - name: filePath
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Object content streamed with correct Content-Type.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '404':
          description: File not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Failed to serve public object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /storage/objects/{objectPath}:
    get:
      tags: [storage]
      operationId: getStorageObject
      summary: Serve an object entity from PRIVATE_OBJECT_DIR
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Object content streamed with correct Content-Type.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '404':
          description: Object not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Failed to serve object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

components:
  schemas:
    HealthStatus:
      type: object
      required: [status, services]
      properties:
        status:
          type: string
          enum: [ok, degraded]
          description: ok when all required services healthy; degraded when any in error state
        services:
          type: object
          description: Per-service health state map
          additionalProperties:
            type: string
            enum: [ok, error, not_configured]
          example:
            postgres: ok
            redis: not_configured

    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string

    SubmitCaptureBody:
      type: object
      properties:
        audioObjectPath:
          type: ["string", "null"]
          description: Object storage path of the uploaded audio file (optional)
        text:
          type: ["string", "null"]
          description: Raw text input (alternative to audio)
        durationSeconds:
          type: ["number", "null"]
          description: Duration of audio in seconds
      description: Either audioObjectPath or text must be provided

    CaptureJobResponse:
      type: object
      required: [messageId, jobId, status]
      properties:
        messageId:
          type: integer
          description: ID of the message row created immediately
        jobId:
          type: string
          description: BullMQ job ID for tracking
        status:
          type: string
          enum: [queued, processing, done, failed]

    VoiceCaptureStarted:
      type: object
      required: [messageId, status]
      properties:
        messageId:
          type: integer
          description: ID of the message row created immediately
        status:
          type: string
          enum: [transcribing]
          description: Always 'transcribing' at submission time

    VoiceCaptureStatus:
      type: object
      required: [messageId, status]
      properties:
        messageId:
          type: integer
        status:
          type: string
          enum: [transcribing, parsed, done]
          description: |
            transcribing — Whisper job pending, no transcript yet.
            parsed — transcript available, Claude parse pending.
            done — transcript and claudeParse both available.
        transcript:
          type: ["string", "null"]
          description: Whisper transcript text (null while transcribing)
        transcriptionConfidence:
          type: ["number", "null"]
          description: Whisper confidence 0.0–1.0 (null while transcribing)
        claudeParse:
          $ref: "#/components/schemas/ParsedEntities"

    CaptureJobStatus:
      type: object
      required: [jobId, status]
      properties:
        jobId:
          type: string
        messageId:
          type: ["integer", "null"]
        status:
          type: string
          enum: [queued, processing, done, failed]
        transcript:
          type: ["string", "null"]
        parsedEntities:
          $ref: "#/components/schemas/ParsedEntities"
        error:
          type: ["string", "null"]

    ParsedEntities:
      type: object
      properties:
        type:
          type: string
          enum: [task, reminder, decision, context, question, draft_request, project]
        title:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        proposedOwnerHint:
          type: ["string", "null"]
        proposedPriority:
          type: ["string", "null"]
          enum: [urgent, high, normal, low]
        proposedDue:
          type: ["string", "null"]
          format: date-time
        tags:
          type: array
          items:
            type: string
        requiresClarification:
          type: boolean
        clarificationQuestion:
          type: ["string", "null"]
        tasks:
          type: array
          items:
            type: object
        followups:
          type: array
          items:
            type: object
        escalations:
          type: array
          items:
            type: object

    Briefing:
      type: object
      required: [id, date, markdown, generatedAt]
      properties:
        id:
          type: integer
        date:
          type: string
          format: date
        markdown:
          type: string
        generatedAt:
          type: string
          format: date-time
        openTasksCount:
          type: ["integer", "null"]
        escalationCount:
          type: ["integer", "null"]

    Principal:
      type: object
      required: [id, fullName, primaryEmail]
      properties:
        id:
          type: integer
        fullName:
          type: string
        primaryPhone:
          type: ["string", "null"]
        primaryEmail:
          type: string
        briefingMorningTime:
          type: ["string", "null"]
        briefingEveningTime:
          type: ["string", "null"]
        timezone:
          type: string
        killSwitch:
          type: boolean
        preferences:
          type: object

    UpdatePrincipalBody:
      type: object
      properties:
        fullName:
          type: ["string", "null"]
        primaryPhone:
          type: ["string", "null"]
        briefingMorningTime:
          type: ["string", "null"]
        briefingEveningTime:
          type: ["string", "null"]
        timezone:
          type: ["string", "null"]
        killSwitch:
          type: ["boolean", "null"]
        preferences:
          type: ["object", "null"]

    Task:
      type: object
      required: [id, title, status, createdAt]
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: ["string", "null"]
        status:
          type: string
          enum: [open, in_progress, done, blocked, captured, dispatched, acknowledged, complete, cancelled]
        priority:
          type: ["string", "null"]
          enum: [low, medium, high, critical, urgent, normal, null]
        assigneeId:
          type: ["integer", "null"]
        assigneeName:
          type: ["string", "null"]
        ownerId:
          type: ["integer", "null"]
        dueDate:
          type: ["string", "null"]
          format: date
        dueAt:
          type: ["string", "null"]
          format: date-time
        authorityTier:
          type: ["string", "null"]
          enum: [A, B, C, null]
        tags:
          type: ["array", "null"]
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateTaskBody:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: ["string", "null"]
        status:
          type: string
          enum: [open, in_progress, done, blocked, captured, dispatched, acknowledged, complete, cancelled]
          default: captured
        priority:
          type: ["string", "null"]
          enum: [low, medium, high, critical, urgent, normal, null]
        assigneeId:
          type: ["integer", "null"]
        ownerId:
          type: ["integer", "null"]
        dueDate:
          type: ["string", "null"]
          format: date
        dueAt:
          type: ["string", "null"]
          format: date-time
        authorityTier:
          type: ["string", "null"]
          enum: [A, B, C, null]
        tags:
          type: ["array", "null"]
          items:
            type: string

    UpdateTaskBody:
      type: object
      properties:
        title:
          type: ["string", "null"]
          minLength: 1
        description:
          type: ["string", "null"]
        status:
          type: ["string", "null"]
          enum: [open, in_progress, done, blocked, captured, dispatched, acknowledged, complete, cancelled, null]
        priority:
          type: ["string", "null"]
          enum: [low, medium, high, critical, urgent, normal, null]
        assigneeId:
          type: ["integer", "null"]
        ownerId:
          type: ["integer", "null"]
        dueDate:
          type: ["string", "null"]
          format: date
        dueAt:
          type: ["string", "null"]
          format: date-time
        authorityTier:
          type: ["string", "null"]
          enum: [A, B, C, null]

    TeamMember:
      type: object
      required: [id, name, role]
      properties:
        id:
          type: integer
        name:
          type: string
        role:
          type: string
        phone:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        avatarUrl:
          type: ["string", "null"]
        isActive:
          type: boolean

    AppSettings:
      type: object
      required: [flags]
      properties:
        flags:
          $ref: "#/components/schemas/FeatureFlags"
        principalName:
          type: ["string", "null"]
        principalPhone:
          type: ["string", "null"]

    FeatureFlags:
      type: object
      properties:
        shadowTeamEnabled:
          type: boolean
        twilioEnabled:
          type: boolean
        autoBriefingEnabled:
          type: boolean
        voiceMemoEnabled:
          type: boolean

    UpdateSettingsBody:
      type: object
      properties:
        flags:
          $ref: "#/components/schemas/FeatureFlags"

    Thread:
      type: object
      required: [id, title, createdAt]
      properties:
        id:
          type: integer
        title:
          type: string
        threadType:
          type: ["string", "null"]
          enum: [principal_talk, team_member, system_internal]
        channel:
          type: ["string", "null"]
          enum: [sms, email, pwa]
        status:
          type: ["string", "null"]
          enum: [active, archived]
        lastMessageAt:
          type: ["string", "null"]
          format: date-time
        messageCount:
          type: ["integer", "null"]
        createdAt:
          type: string
          format: date-time

    ThreadWithMessages:
      type: object
      required: [thread, messages]
      properties:
        thread:
          $ref: "#/components/schemas/Thread"
        messages:
          type: array
          items:
            $ref: "#/components/schemas/Message"

    Message:
      type: object
      required: [id, threadId, role, content, createdAt]
      properties:
        id:
          type: integer
        threadId:
          type: integer
        role:
          type: string
          enum: [user, assistant, system]
        content:
          type: string
        audioObjectPath:
          type: ["string", "null"]
        direction:
          type: ["string", "null"]
          enum: [inbound, outbound]
        senderType:
          type: ["string", "null"]
          enum: [principal, agent, team_member, external]
        contentType:
          type: ["string", "null"]
          enum: [text, voice, image, file, system]
        contentUrl:
          type: ["string", "null"]
        transcriptionConfidence:
          type: ["number", "null"]
        claudeParse:
          type: ["object", "null"]
        createdAt:
          type: string
          format: date-time

    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name:
          type: string
          minLength: 1
          description: Original file name.
        size:
          type: integer
          minimum: 1
          description: File size in bytes.
        contentType:
          type: string
          minLength: 1
          description: MIME type of the file (e.g. `image/jpeg`).

    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL:
          type: string
          format: uri
          description: Presigned GCS URL for PUT upload.
        objectPath:
          type: string
          description: Normalized object path (e.g. `/objects/uploads/uuid`). Store this in your database.
        metadata:
          $ref: '#/components/schemas/UploadUrlRequest'
